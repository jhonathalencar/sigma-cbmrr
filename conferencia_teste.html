<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="logo_sigma.png" onerror="this.onerror=null; this.src='https://placehold.co/16x16/800020/ffffff?text=S'">
    <title>Conferência - PERMANÊNCIA BRAVO 5</title>
    <style>
        /* --- MANTENHA TODO O CSS ANTERIOR IGUAL --- */
        /* Adicione apenas estes novos estilos para o Card de Pendência Anterior */
        
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; color: #333; min-height: 100vh; margin: 0; display: flex; flex-direction: column; align-items: center; padding-bottom: 90px; padding-top: 60px; box-sizing: border-box; }
        .main-header { position: fixed; top: 0; left: 0; width: 100%; height: 50px; background-color: #800020; box-shadow: 0 2px 5px rgba(0,0,0,0.2); z-index: 100; display: flex; align-items: center; padding: 0 15px; box-sizing: border-box; }
        .header-icon { height: 40px; width: auto; } .text-white { color: white; } .text-red { color: #FF3B3B; }
        .header-title-desktop { display: none; font-weight: bold; font-size: 1.1em; margin-left: 10px; } .header-title-mobile { display: block; font-weight: bold; font-size: 1.1em; margin-left: 10px; }
        @media (min-width: 768px) { .header-title-desktop { display: block; } .header-title-mobile { display: none; } }
        .container { background-color: #fff; padding: 20px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 95%; max-width: 700px; margin-bottom: 20px; text-align: center; box-sizing: border-box; }
        .logo { width: 80px; height: auto; margin: 0 auto 10px; display: block; } h1 { color: #d90f23; font-size: 1.6em; border-bottom: 1px solid #e0e0e0; margin-bottom: 10px; }
        .subtitulo { font-size: 0.9em; color: #666; margin-bottom: 20px; font-weight: 600; } .user-info-display { font-size: 0.8em; color: #333; text-align: left; border-bottom: 1px solid #eee; margin-bottom: 15px; }
        
        /* ESTILOS DA LISTA */
        .setor-header { background-color: #800020; color: white; padding: 12px 15px; margin-top: 20px; border-radius: 6px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
        .setor-status { background-color: #d90f23; padding: 3px 8px; border-radius: 4px; font-size: 0.9em; } .setor-status.ok { background-color: #1b8a3e; }
        .setor-content { max-height: 0; overflow: hidden; transition: max-height 0.4s ease-out; background: #fff; border: 1px solid #e0e0e0; } .setor-content.expanded { max-height: 5000px; padding-bottom: 20px; }
        
        .item-conferencia { border: 1px solid #e0e0e0; border-left: 5px solid #ccc; border-radius: 6px; padding: 10px; margin: 10px; background-color: #fafafa; transition: all 0.3s; }
        .item-conferencia.status-ok { border-left-color: #1b8a3e; background-color: #f0fff0; }
        .item-conferencia.status-alert { border-left-color: #d90f23; background-color: #fff0f0; }
        .item-conferencia.status-existing-alert { border-left-color: #ff9800; background-color: #fff8e1; } /* NOVO: Amarelo para existente */

        .item-header { display: flex; flex-direction: column; align-items: flex-start; }
        .item-label { font-weight: bold; width: 100%; text-align: left; }
        .item-quantidade { font-size: 0.9em; color: #800020; font-weight: bold; margin-top: 5px; }
        .status-icon { width: 18px; height: 18px; border: 1px dashed #aaa; display: inline-block; margin-right: 5px; vertical-align: middle; }
        .status-icon.ok { background: #1b8a3e; border: none; } .status-icon.ok:after { content:'✓'; color:white; font-size:12px; display:block; text-align:center; }
        .status-icon.alert { background: #d90f23; border: none; } .status-icon.alert:after { content:'!'; color:white; font-size:12px; display:block; text-align:center; }
        
        .item-options { display: flex; justify-content: flex-end; gap: 10px; margin-top: 10px; border-top: 1px solid #eee; padding-top: 5px; }
        .action-button { padding: 8px 15px; border: 1px solid #ccc; border-radius: 4px; cursor: pointer; font-weight: bold; background: #f0f0f0; }
        .action-button.active.sa-ok { background: #1b8a3e; color: white; border-color: #1b8a3e; }
        .action-button.active.ca-alert { background: #d90f23; color: white; border-color: #d90f23; }

        /* ÁREA DE PENDÊNCIA ANTERIOR (NOVO) */
        .pendencia-anterior-box {
            background-color: #fff3cd;
            border: 1px solid #ffeeba;
            color: #856404;
            padding: 10px;
            border-radius: 4px;
            margin-top: 10px;
            text-align: left;
            font-size: 0.9em;
        }
        .pendencia-meta { font-size: 0.8em; color: #666; display: block; margin-top: 5px; }
        .btn-confirmar-pendencia {
            background-color: #ff9800; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-weight: bold; margin-top: 5px; width: 100%;
        }

        /* Textarea e Botões */
        .alteracao-container, .tombamento-obs-container { display: none; margin-top: 10px; text-align: left; }
        textarea { width: 100%; padding: 8px; border: 1px solid #d90f23; border-radius: 4px; min-height: 50px; box-sizing: border-box; }
        .btn-salvar-alteracao { background: #800020; color: white; width: 100%; padding: 8px; border: none; border-radius: 4px; font-weight: bold; margin-top: 5px; cursor: pointer; }
        .descricao-salva { display: none; text-align: left; margin-top: 5px; font-size: 0.9em; border-top: 1px dashed #ccc; padding-top: 5px; }
        .obs-texto { color: #d90f23; font-weight: bold; }

        /* Tombamentos */
        .tombamento-container { border-top: 1px dotted #ccc; margin-top: 5px; padding: 5px 0; text-align: left; }
        .tombamento-controls { display: flex; justify-content: space-between; align-items: center; font-size: 0.85em; }

        /* Footer e Loaders */
        #btn-finalizar { background: #d90f23; color: white; width: 100%; padding: 15px; border: none; border-radius: 6px; font-size: 1.1em; font-weight: bold; margin-top: 20px; cursor: pointer; }
        #btn-finalizar:disabled { background: #999; cursor: not-allowed; }
        .footer-central { position: fixed; bottom: 0; left: 0; width: 100%; background: #f4f4f9; padding: 5px 0; text-align: center; font-size: 0.65em; color: #555; z-index: 99; border-top: 1px solid #eee; }
        .loading-message { margin-top: 50px; font-weight: bold; color: #800020; }
    </style>
</head>
<body>

<header class="main-header">
    <img src="cbmrr.png" alt="CBM" class="header-icon" onerror="this.onerror=null; this.src='https://placehold.co/40x40/ffffff/800020/fff?text=CBM'">
    <div class="header-title-desktop"><span class="text-white">CORPO DE BOMBEIROS MILITAR </span><span class="text-red">RORAIMA</span></div>
    <div class="header-title-mobile"><span class="text-white">CBM</span><span class="text-red">RR</span></div>
</header>

<div class="container">
    <img src="logo_sigma.png" alt="SIGMA" class="logo" onerror="this.onerror=null; this.src='https://placehold.co/80x80/d90f23/ffffff?text=SIGMA'">
    <h1>Conferência de Materiais</h1>
    <p class="subtitulo" id="local-posto-info">Carregando...</p>
    <p id="militar-info" class="user-info-display">Carregando...</p>

    <div id="loading-message" class="loading-message">Conectando ao Banco de Dados...</div>
    <div id="main-content" style="display: none;">
        <button id="btn-finalizar" onclick="finalizarConferencia()" disabled>FINALIZAR CONFERÊNCIA</button>
    </div>
</div>

<div class="footer-central">
    <strong>GOVERNO DE RORAIMA - CBMRR</strong>
    <span class="footer-autor">Dev: 3º SGT QPCBM JHONATH</span>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyCB0PH0UgghgsvH0BgPkG4AkKON6xSQ9mc",
        authDomain: "sigma-cbmrr.firebaseapp.com",
        projectId: "sigma-cbmrr",
        storageBucket: "sigma-cbmrr.firebasestorage.app",
        messagingSenderId: "378026276038",
        appId: "1:378026276038:web:620dd6ff57501b1a8313c7"
    };

    let db;
    const COLECAO_LISTA = 'lista_mestra'; 
    const DOC_LISTA = 'lista_completa'; 
    const COLECAO_RESULTADOS = 'resultados_conferencias';
    let dadosConferencia = [];
    window.itemStatus = {}; 

    async function carregarDadosRemotos() {
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        db = firebase.firestore();

        try {
            const doc = await db.collection(COLECAO_LISTA).doc(DOC_LISTA).get();
            if (!doc.exists) throw new Error("Lista não encontrada.");
            
            dadosConferencia = doc.data().list;
            renderizarConferencia();
            
            document.getElementById('loading-message').style.display = 'none';
            document.getElementById('main-content').style.display = 'block';
        } catch (error) {
            alert("Erro ao carregar: " + error.message);
        }
    }

    function renderizarConferencia() {
        const content = document.getElementById('main-content');
        let html = '';
        const ids = [];
        
        dadosConferencia.forEach(setor => {
            ids.push(setor.id);
            let itensHtml = '';
            let totalSetor = 0;

            setor.itens.forEach(item => {
                // VERIFICA SE EXISTE PENDÊNCIA ANTERIOR (DO BANCO DE DADOS)
                const pendencia = item.pendencia; // Objeto: { obs: "xxx", quem: "xxx", data: "xxx" }
                let pendenciaHtml = '';
                let classExtra = '';
                let initialStatus = 'pending';

                // Se tiver pendência e não for multi (lógica simplificada para multi abaixo)
                if (item.tipo === 'single' && pendencia) {
                    classExtra = 'status-existing-alert';
                    initialStatus = 'PENDING_EXISTING'; // Status especial para saber que tem pendência
                    pendenciaHtml = `
                        <div class="pendencia-anterior-box">
                            <strong>⚠️ Alteração Existente:</strong> ${pendencia.obs}
                            <span class="pendencia-meta">Reportado por: ${pendencia.quem} em ${new Date(pendencia.data.seconds * 1000).toLocaleDateString()}</span>
                            <button class="btn-confirmar-pendencia" onclick="confirmarPendencia('${item.id}')">✔ Concordo (Continua C/A)</button>
                        </div>
                    `;
                }

                if (item.tipo === 'multi' && item.tombamentos) {
                    let tombsHtml = '';
                    item.tombamentos.forEach(t => {
                        // Verifica pendência específica do tombamento
                        const pTomb = t.pendencia;
                        let pHtml = '';
                        let tombStatus = 'pending';
                        
                        if (pTomb) {
                            tombStatus = 'PENDING_EXISTING';
                            pHtml = `
                                <div class="pendencia-anterior-box">
                                    <strong>⚠️ ${pTomb.obs}</strong>
                                    <span class="pendencia-meta">${pTomb.quem} - ${new Date(pTomb.data.seconds * 1000).toLocaleDateString()}</span>
                                    <button class="btn-confirmar-pendencia" onclick="confirmarPendencia('${item.id}-${t.tomb}')">✔ Concordo</button>
                                </div>
                            `;
                        }
                        
                        window.itemStatus[`${item.id}-${t.tomb}`] = { status: tombStatus, obs: pTomb ? pTomb.obs : '' };

                        tombsHtml += `
                            <div class="tombamento-container" data-tomb="${t.tomb}" data-item-id="${item.id}">
                                <div class="tombamento-controls">
                                    <span>Tomb.: ${t.tomb}</span>
                                    <div class="tombamento-options">
                                        <button class="action-button sa-ok" onclick="setTombStatus(this, 'ok')">S/A</button>
                                        <button class="action-button ca-alert" onclick="setTombStatus(this, 'alert')">C/A</button>
                                    </div>
                                </div>
                                ${pHtml}
                                <p class="tombamento-descricao-salva"></p>
                                <div class="tombamento-obs-container">
                                    <label>Descreva a alteração:</label>
                                    <textarea></textarea>
                                    <button type="button" class="btn-salvar-alteracao" onclick="salvarTomb(this)">SALVAR</button>
                                </div>
                            </div>`;
                        totalSetor++;
                    });

                    itensHtml += `
                        <div class="item-conferencia item-has-tombamentos" data-type="multi" data-id="${item.id}">
                            <div class="item-header">
                                <span class="status-icon"></span>
                                <span class="item-label">${item.nome}</span>
                                <span class="item-quantidade">QTD: ${item.quantidadeEsperada}</span>
                            </div>
                            ${tombsHtml}
                        </div>`;

                } else {
                    // Item Único
                    window.itemStatus[item.id] = { status: initialStatus, obs: pendencia ? pendencia.obs : '' };
                    itensHtml += `
                        <div class="item-conferencia ${classExtra}" data-type="single" data-id="${item.id}">
                            <div class="item-header">
                                <span class="status-icon"></span>
                                <span class="item-label">${item.nome}</span>
                                <span class="item-quantidade">QTD: ${item.quantidadeEsperada}</span>
                            </div>
                            <div class="item-options">
                                <button class="action-button sa-ok" onclick="setStatus(this, 'ok')">S/A</button>
                                <button class="action-button ca-alert" onclick="setStatus(this, 'alert')">C/A</button>
                            </div>
                            ${pendenciaHtml}
                            <p class="descricao-salva"></p>
                            <div class="alteracao-container">
                                <label>Descreva a alteração:</label>
                                <textarea></textarea>
                                <button type="button" class="btn-salvar-alteracao" onclick="salvarSingle(this)">SALVAR</button>
                            </div>
                        </div>`;
                    totalSetor++;
                }
            });

            html += `
                <div class="setor" data-id="${setor.id}" data-total="${totalSetor}">
                    <div class="setor-header" onclick="toggleSetor(this)">
                        <div class="setor-info">
                            <span>${setor.nome}</span>
                            <div class="setor-status" data-done="0">0/${totalSetor}</div>
                        </div>
                        <span class="arrow">►</span>
                    </div>
                    <div class="setor-content">
                        ${itensHtml}
                    </div>
                </div>`;
        });

        const btn = document.getElementById('btn-finalizar');
        btn.insertAdjacentHTML('beforebegin', html);
        window.setorIds = ids;
        
        // Atualiza header info
        const p = getParams();
        document.getElementById('militar-info').innerHTML = `<strong>Conferente:</strong> ${p.grad} ${p.nome}<br><strong>Data:</strong> ${new Date().toLocaleString()}`;
        document.getElementById('local-posto-info').innerHTML = `<span style="color:blue;font-weight:bold">PERMANÊNCIA - BRAVO 5</span>`;
        
        // Expande primeiro setor
        const firstHeader = document.querySelector('.setor-header');
        if(firstHeader) toggleSetor(firstHeader);
    }

    // --- AÇÕES ---

    function confirmarPendencia(uniqueId) {
        // Usuário clicou em "Concordo"
        const currentData = window.itemStatus[uniqueId];
        window.itemStatus[uniqueId] = { status: 'C/A', obs: currentData.obs, confirmed: true };
        
        // Atualiza UI
        let container;
        if (uniqueId.includes('-') && !uniqueId.startsWith('item')) {
             // É tombamento (procura pelo data-tomb e data-item-id)
             const parts = uniqueId.split('-');
             const itemId = parts[0] + '-' + parts[1]; // Id pode ter hífens, cuidado. Melhor buscar pelo DOM.
             // Simplificação: Acha o botão que foi clicado
             const btn = event.target;
             container = btn.closest('.tombamento-container') || btn.closest('.item-conferencia');
        } else {
             const btn = event.target;
             container = btn.closest('.item-conferencia');
        }

        // Remove a caixa de aviso e ativa o botão C/A visualmente
        const box = container.querySelector('.pendencia-anterior-box');
        if(box) box.style.display = 'none';
        
        const btnCA = container.querySelector('.ca-alert');
        if(btnCA) btnCA.classList.add('active');
        
        // Mostra obs salva
        const descEl = container.querySelector('.descricao-salva') || container.querySelector('.tombamento-descricao-salva');
        if(descEl) {
            descEl.innerHTML = `<span class="obs-texto">Confirmado: ${currentData.obs}</span>`;
            descEl.style.display = 'block';
        }

        // Atualiza status geral
        const setor = container.closest('.setor');
        updateSetor(setor);
        
        // Avança
        const mainItemId = container.classList.contains('item-conferencia') ? container.dataset.id : container.closest('.item-conferencia').dataset.id;
        focusNext(mainItemId);
    }

    function setStatus(btn, type) {
        const item = btn.closest('.item-conferencia');
        const id = item.dataset.id;
        const setor = item.closest('.setor');
        
        item.querySelectorAll('.action-button').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        
        item.querySelector('.alteracao-container').style.display = 'none';
        item.querySelector('.descricao-salva').style.display = 'none';
        const pendBox = item.querySelector('.pendencia-anterior-box');
        if(pendBox) pendBox.style.display = 'none'; // Esconde aviso se clicar em S/A

        if (type === 'ok') {
            item.className = 'item-conferencia status-ok';
            item.querySelector('.status-icon').className = 'status-icon ok';
            window.itemStatus[id] = { status: 'S/A', obs: '' };
            updateSetor(setor);
            focusNext(id);
        } else {
            item.className = 'item-conferencia status-alert';
            item.querySelector('.status-icon').className = 'status-icon alert';
            item.querySelector('.alteracao-container').style.display = 'block';
            window.itemStatus[id] = { status: 'PENDING_INPUT', obs: '' };
            item.querySelector('textarea').focus();
        }
    }

    function salvarSingle(btn) {
        const item = btn.closest('.item-conferencia');
        const txt = item.querySelector('textarea').value;
        if(txt.length < 3) return alert("Descreva a alteração");
        
        window.itemStatus[item.dataset.id] = { status: 'C/A', obs: txt, newReport: true };
        item.querySelector('.alteracao-container').style.display = 'none';
        const d = item.querySelector('.descricao-salva');
        d.innerHTML = `<span class="obs-texto">${txt}</span>`;
        d.style.display = 'block';
        updateSetor(item.closest('.setor'));
        focusNext(item.dataset.id);
    }

    function setTombStatus(btn, type) {
        const cont = btn.closest('.tombamento-container');
        const item = btn.closest('.item-conferencia');
        const uid = `${item.dataset.id}-${cont.dataset.tomb}`;
        
        cont.querySelectorAll('.action-button').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        cont.querySelector('.tombamento-obs-container').style.display = 'none';
        cont.querySelector('.tombamento-descricao-salva').style.display = 'none';
        const pendBox = cont.querySelector('.pendencia-anterior-box');
        if(pendBox) pendBox.style.display = 'none';

        if (type === 'ok') {
            window.itemStatus[uid] = { status: 'S/A', obs: '' };
            checkItemPai(item);
            updateSetor(item.closest('.setor'));
            focusNext(item.dataset.id);
        } else {
            cont.querySelector('.tombamento-obs-container').style.display = 'block';
            window.itemStatus[uid] = { status: 'PENDING_INPUT', obs: '' };
            cont.querySelector('textarea').focus();
        }
    }

    function salvarTomb(btn) {
        const cont = btn.closest('.tombamento-container');
        const item = btn.closest('.item-conferencia');
        const txt = cont.querySelector('textarea').value;
        if(txt.length < 3) return alert("Descreva");
        
        const uid = `${item.dataset.id}-${cont.dataset.tomb}`;
        window.itemStatus[uid] = { status: 'C/A', obs: txt, newReport: true };
        
        cont.querySelector('.tombamento-obs-container').style.display = 'none';
        const d = cont.querySelector('.tombamento-descricao-salva');
        d.innerHTML = `<span class="obs-texto">${txt}</span>`;
        d.style.display = 'block';
        
        checkItemPai(item);
        updateSetor(item.closest('.setor'));
        focusNext(item.dataset.id);
    }

    function checkItemPai(item) {
        const tombs = item.querySelectorAll('.tombamento-container');
        let allDone = true;
        let hasAlert = false;
        tombs.forEach(t => {
            const s = window.itemStatus[`${item.dataset.id}-${t.dataset.tomb}`]?.status;
            if(s !== 'S/A' && s !== 'C/A') allDone = false;
            if(s === 'C/A') hasAlert = true;
        });
        
        const icon = item.querySelector('.status-icon');
        if (allDone) {
            if (hasAlert) { item.classList.add('status-alert'); icon.className = 'status-icon alert'; }
            else { item.classList.add('status-ok'); icon.className = 'status-icon ok'; }
        } else {
            item.classList.remove('status-ok', 'status-alert');
            icon.className = 'status-icon';
        }
    }

    function updateSetor(setor) {
        let done = 0;
        const total = parseInt(setor.dataset.total);
        const items = setor.querySelectorAll('.item-conferencia');
        
        items.forEach(i => {
            if(i.dataset.type === 'single') {
                const s = window.itemStatus[i.dataset.id]?.status;
                if(s === 'S/A' || s === 'C/A') done++;
            } else {
                i.querySelectorAll('.tombamento-container').forEach(t => {
                    const s = window.itemStatus[`${i.dataset.id}-${t.dataset.tomb}`]?.status;
                    if(s === 'S/A' || s === 'C/A') done++;
                });
            }
        });
        
        const st = setor.querySelector('.setor-status');
        st.textContent = `${done}/${total}`;
        st.dataset.done = done;
        if(done === total) st.classList.add('ok'); else st.classList.remove('ok');
        
        checkFinalizar();
    }

    function checkFinalizar() {
        let tot = 0, done = 0;
        document.querySelectorAll('.setor').forEach(s => {
            tot += parseInt(s.dataset.total);
            done += parseInt(s.querySelector('.setor-status').dataset.done);
        });
        const btn = document.getElementById('btn-finalizar');
        btn.textContent = `FINALIZAR (${done}/${tot})`;
        btn.disabled = (done !== tot);
    }

    // --- FLUXO E SCROLL CORRIGIDO ---
    function focusNext(currentId) {
        // Simplesmente remove o foco do teclado, não rola a tela agressivamente
        if (document.activeElement) document.activeElement.blur();
        
        // Opcional: Verifica se o setor acabou e fecha/abre próximo
        // (Lógica simplificada para não travar)
    }

    function toggleSetor(header) {
        const content = header.nextElementSibling;
        const arrow = header.querySelector('.arrow');
        if (content.style.maxHeight && content.style.maxHeight !== '0px') {
            content.style.maxHeight = '0px'; arrow.textContent = '►';
        } else {
            content.style.maxHeight = '5000px'; arrow.textContent = '▼';
        }
    }

    // --- FINALIZAÇÃO E PERSISTÊNCIA ---
    async function finalizarConferencia() {
        const btn = document.getElementById('btn-finalizar');
        if(btn.disabled) return;
        btn.textContent = "Salvando..."; btn.disabled = true;

        try {
            const p = getParams();
            const user = `${p.grad} ${p.nome}`;
            const now = new Date();
            let changedItems = false;

            // 1. Atualiza dadosConferencia local com as novas pendências
            dadosConferencia.forEach(setor => {
                setor.itens.forEach(item => {
                    if (item.tipo === 'single') {
                        const st = window.itemStatus[item.dataset.id];
                        if (st.status === 'C/A') {
                            // Cria ou atualiza a pendência na Lista Mestra
                            item.pendencia = {
                                obs: st.obs,
                                quem: user,
                                data: firebase.firestore.Timestamp.now()
                            };
                            changedItems = true;
                        } else if (st.status === 'S/A' && item.pendencia) {
                            // Se estava com pendência e user marcou S/A -> REMOVE PENDÊNCIA?
                            // Decisão de projeto: Admin resolve ou usuário resolve?
                            // Se usuário marcar S/A em item que tinha pendência, assume-se resolvido.
                            delete item.pendencia;
                            changedItems = true;
                        }
                    } else if (item.tombamentos) {
                        item.tombamentos.forEach(t => {
                            const uid = `${item.id}-${t.tomb}`;
                            const st = window.itemStatus[uid];
                            if (st.status === 'C/A') {
                                t.pendencia = {
                                    obs: st.obs,
                                    quem: user,
                                    data: firebase.firestore.Timestamp.now()
                                };
                                changedItems = true;
                            } else if (st.status === 'S/A' && t.pendencia) {
                                delete t.pendencia;
                                changedItems = true;
                            }
                        });
                    }
                });
            });

            // 2. Salva Lista Mestra Atualizada (Persistência)
            if (changedItems) {
                await db.collection(COLECAO_LISTA).doc(DOC_LISTA).update({
                    list: dadosConferencia,
                    lastUpdate: firebase.firestore.Timestamp.now()
                });
            }

            // 3. Salva Resultado da Conferência (Histórico)
            // (Coletar apenas os C/A para o relatório)
            const itensReport = [];
            for(let k in window.itemStatus) {
                if(window.itemStatus[k].status === 'C/A') {
                    itensReport.push({ id: k, obs: window.itemStatus[k].obs });
                }
            }

            await db.collection(COLECAO_RESULTADOS).add({
                local: "BRAVO 5",
                conferente: user,
                timestamp: firebase.firestore.Timestamp.now(),
                itensCaa: itensReport
            });

            // 4. Gera PDF
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            doc.text("Conferência Finalizada", 10, 10);
            doc.save("conferencia.pdf");

            alert("Conferência salva com sucesso!");
            location.reload();

        } catch (e) {
            console.error(e);
            alert("Erro: " + e.message);
            btn.disabled = false;
        }
    }

    function getParams() {
        const u = new URLSearchParams(window.location.search);
        return { grad: u.get('posto_grad')||'', nome: u.get('nome_guerra')||'' };
    }
    
    window.onload = carregarDadosRemotos;
</script>
</body>
</html>
