<script>
    const firebaseConfig = { apiKey: "AIzaSyCB0PH0UgghgsvH0BgPkG4AkKON6xSQ9mc", authDomain: "sigma-cbmrr.firebaseapp.com", projectId: "sigma-cbmrr", storageBucket: "sigma-cbmrr.firebasestorage.app", messagingSenderId: "378026276038", appId: "1:378026276038:web:620dd6ff57501b1a8313c7" };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const COLECAO_RESULTADOS='resultados_conferencias', COLECAO_LISTA_MESTRA='lista_mestra', COLECAO_HISTORICO_ACOES='historico_acoes_ca', DOCUMENTO_LISTA_MESTRA_ID='lista_completa';
    let dadosConferencia=[], allCaaDataGlobal=[];

    function switchView(v) { document.querySelectorAll('.view-section').forEach(e=>e.classList.remove('active-view')); document.querySelectorAll('.sidebar a').forEach(e=>e.classList.remove('active')); if(v==='dashboard'){ document.getElementById('view-dashboard').classList.add('active-view'); document.getElementById('link-dashboard').classList.add('active'); loadCaaData(); } else { document.getElementById('view-permanencia').classList.add('active-view'); document.getElementById('link-permanencia').classList.add('active'); carregarDadosGerenciador(); } }

    async function loadCaaData() {
        const loading=document.getElementById('loading-message-dashboard'), cards=document.getElementById('cards-container'), wrapper=document.getElementById('ca-table-wrapper');
        loading.style.display='block'; cards.innerHTML=''; wrapper.style.display='none';
        try {
            const snap = await db.collection(COLECAO_RESULTADOS).get();
            allCaaDataGlobal=[];
            snap.forEach(doc=>{
                const d=doc.data();
                if(Array.isArray(d.itensCaa)) d.itensCaa.forEach((i,idx)=>{ if(i.statusAdmin!=='Solucionado') allCaaDataGlobal.push({...i, local:d.local||'N/D', conferente:d.conferente||'N/D', timestamp:d.timestamp?new Date(d.timestamp.toDate()).toLocaleString('pt-BR'):'N/D', docId:doc.id, originalIndex:idx}); });
            });
            loading.style.display='none';
            if(allCaaDataGlobal.length===0) cards.innerHTML='<p style="padding:20px;color:green;">✅ Nenhuma alteração pendente.</p>'; else renderSectorCards(allCaaDataGlobal);
        } catch(e){ console.error(e); loading.textContent="Erro ao carregar."; }
    }
    function renderSectorCards(items){ const c=document.getElementById('cards-container'), g={}; items.forEach(i=>{ if(!g[i.local])g[i.local]=[]; g[i.local].push(i); }); for(const l in g){ const div=document.createElement('div'); div.className='sector-card'; div.innerHTML=`<h3>${l}</h3><span class="count-value">${g[l].length}</span><span class="label-pendencias">itens c/ alteração</span>`; div.onclick=()=>{ document.querySelectorAll('.sector-card').forEach(x=>x.classList.remove('active-card')); div.classList.add('active-card'); mostrarTabelaPorSetor(l,g[l]); }; c.appendChild(div); } }
    function mostrarTabelaPorSetor(local, items){ const t=document.getElementById('ca-list-body'); document.getElementById('table-title').textContent=`Detalhes: ${local}`; t.innerHTML=''; items.forEach(i=>{ const tr=t.insertRow(); if(i.statusAdmin==='Em solução')tr.classList.add('row-amarelo'); if(i.statusAdmin==='Cautelado')tr.classList.add('row-laranja'); tr.insertCell().innerHTML=`<strong>${i.nomeCompleto}</strong>`; tr.insertCell().innerHTML=`<span class="status-badge ${i.statusAdmin==='Em solução'?'badge-solucao':i.statusAdmin==='Cautelado'?'badge-cautela':'badge-pendente'}">${i.statusAdmin||'Pendente'}</span>`; tr.insertCell().textContent=i.obs||'-'; tr.insertCell().innerHTML=`<small>${i.conferente}<br>${i.timestamp}</small>`; const td=tr.insertCell(); const b=document.createElement('button'); b.className='btn-action btn-gerenciar'; b.innerHTML='<i class="fas fa-cog"></i> Gerenciar'; b.onclick=()=>abrirModalGestao(i); td.appendChild(b); }); document.getElementById('ca-table-wrapper').style.display='block'; document.getElementById('ca-table-wrapper').scrollIntoView({behavior:'smooth',block:'start'}); }
    function fecharTabela(){ document.getElementById('ca-table-wrapper').style.display='none'; document.querySelectorAll('.sector-card').forEach(c=>c.classList.remove('active-card')); }

    function abrirModalGestao(i){ document.getElementById('gestao-item-nome').textContent=i.nomeCompleto; document.getElementById('gestao-doc-id').value=i.docId; document.getElementById('gestao-item-index').value=i.originalIndex; document.getElementById('gestao-item-id-lista').value=i.id; document.getElementById('gestao-status').value=i.statusAdmin||'Solucionado'; document.getElementById('gestao-obs').value=''; document.getElementById('gestao-qtd').value='1'; toggleGestaoQtd(); document.getElementById('modal-gestao-ca').style.display='flex'; }
    function fecharModalGestao(){ document.getElementById('modal-gestao-ca').style.display='none'; }
    function toggleGestaoQtd(){ document.getElementById('div-gestao-qtd').style.display=(document.getElementById('gestao-status').value==='Remover'?'block':'none'); }

    // --- ATUALIZAÇÃO DA LÓGICA DE ADMIN ---
    async function salvarGestaoCa(){
        const docId=document.getElementById('gestao-doc-id').value, idx=parseInt(document.getElementById('gestao-item-index').value), itemId=document.getElementById('gestao-item-id-lista').value, status=document.getElementById('gestao-status').value, obs=document.getElementById('gestao-obs').value.trim(), qtd=parseInt(document.getElementById('gestao-qtd').value);
        if(!obs) return alert("Descreva o que foi feito ou dê um parecer.");
        try {
            // 1. Atualiza o Histórico local (Resultados)
            const ref=db.collection(COLECAO_RESULTADOS).doc(docId);
            const snap=await ref.get(); if(!snap.exists) throw new Error("Erro doc");
            const items=snap.data().itensCaa; 
            items[idx].statusAdmin=(status==='Remover'?'Solucionado':status); // Se remover, sai da lista de C/A
            await ref.update({itensCaa:items});

            // 2. ATUALIZAÇÃO DA LISTA MESTRA (O CÉREBRO DA OPERAÇÃO)
            const listRef = db.collection(COLECAO_LISTA_MESTRA).doc(DOCUMENTO_LISTA_MESTRA_ID);
            const listSnap = await listRef.get();
            let lista = listSnap.data().list;
            let updated = false;

            lista.forEach(s => {
                s.itens.forEach(i => {
                    // Função auxiliar para verificar e atualizar item
                    const checkAndUpdate = (targetItem, targetId) => {
                        // Lógica para Itens Normais ou Tombamentos Específicos
                        // Se for Tombamento, o ID vem composto (ex: "ID-TOMB"), mas aqui varremos o objeto tombamento
                        // Simplificando: Se acharmos a pendência, atualizamos ela.
                        
                        if (targetItem.pendencia) {
                            // Se for Solucionado ou Remover, deletamos a pendência
                            if (status === 'Solucionado' || status === 'Remover') {
                                delete targetItem.pendencia;
                                updated = true;
                            } 
                            // Se for "Em solução" ou "Cautelado", ATUALIZAMOS a pendência com o parecer do Admin
                            else {
                                targetItem.pendencia.statusAdmin = status;
                                targetItem.pendencia.adminObs = obs;
                                // Não mudamos 'quem' ou 'obs' original do usuário para manter o histórico visual
                                updated = true;
                            }
                        }
                    };

                    // Verifica Item Single
                    if(i.id === itemId && i.tipo === 'single') checkAndUpdate(i, itemId);
                    
                    // Verifica Multi
                    if(i.tipo === 'multi' && i.tombamentos) {
                        i.tombamentos.forEach(t => {
                            // O itemId vindo do modal para multi é "ID_ITEM-TOMBAMENTO"
                            if(`${i.id}-${t.tomb}` === itemId) checkAndUpdate(t, itemId);
                        });
                    }
                });
            });

            if(updated) await listRef.update({list:lista});
            if(status==='Remover') await removerItemDaListaMestra(itemId, qtd); // Função auxiliar existente abaixo

            // Log
            await db.collection(COLECAO_HISTORICO_ACOES).add({data:firebase.firestore.FieldValue.serverTimestamp(), item:document.getElementById('gestao-item-nome').textContent, acao:status, observacao:obs, qtdRemovida:(status==='Remover'?qtd:0), usuario:'Admin'});
            alert("Status atualizado com sucesso!"); fecharModalGestao(); loadCaaData();
        } catch(e){ console.error(e); alert("Erro ao salvar"); }
    }

    async function removerItemDaListaMestra(itemId, qtd){ const ref=db.collection(COLECAO_LISTA_MESTRA).doc(DOCUMENTO_LISTA_MESTRA_ID); const s=await ref.get(); if(!s.exists)return; let l=s.data().list; let f=false; for(const st of l){ const idx=st.itens.findIndex(i=>i.id===itemId); if(idx!==-1){ const i=st.itens[idx]; i.quantidadeEsperada-=qtd; if(i.quantidadeEsperada<=0)st.itens.splice(idx,1); f=true; break; } } if(f) await ref.update({list:l, updatedAt:firebase.firestore.FieldValue.serverTimestamp()}); }

    // ADMIN PADRÃO
    async function carregarDadosGerenciador(){ const m=document.getElementById('loading-message-admin'), c=document.getElementById('main-admin-content'); m.style.display='block'; c.style.display='none'; try{const d=await db.collection(COLECAO_LISTA_MESTRA).doc(DOCUMENTO_LISTA_MESTRA_ID).get(); if(d.exists)dadosConferencia=d.data().list; else dadosConferencia=[]; m.style.display='none'; c.style.display='block'; renderizarLista();}catch(e){console.error(e);m.textContent="Erro.";}}
    async function salvarDados(a=true){ try{ await db.collection(COLECAO_LISTA_MESTRA).doc(DOCUMENTO_LISTA_MESTRA_ID).set({list:dadosConferencia, updatedAt:firebase.firestore.FieldValue.serverTimestamp()}); if(a)alert("Salvo!"); }catch(e){alert("Erro");} }
    function gerarNovoId(){ return Date.now().toString().slice(-6)+Math.floor(Math.random()*100).toString().padStart(2,'0'); }
    function adicionarSetor(n){ n=n.trim().toUpperCase(); if(!n)return; dadosConferencia.push({id:gerarNovoId(), nome:n, itens:[]}); document.getElementById('input-setor-nome').value=''; salvarDados(false); renderizarLista(); }
    function removerSetor(id){ if(confirm("Remover setor?")) { dadosConferencia=dadosConferencia.filter(x=>x.id!==id); salvarDados(false); renderizarLista(); } }
    function adicionarItemPorSetor(sid){ const n=document.getElementById('input-item-nome-'+sid).value.trim().toUpperCase(); const q=parseInt(document.getElementById('input-item-qtd-'+sid).value); const t=document.getElementById('select-item-tipo-'+sid).value; if(!n||q<1)return; const s=dadosConferencia.find(x=>x.id===sid); const novo={id:sid+'-'+gerarNovoId(), nome:n, quantidadeEsperada:q, tipo:t, tombamentos:[]}; if(t==='multi')for(let i=0;i<q;i++)novo.tombamentos.push({tomb:'NOVO-'+(i+1),status:'pending',obs:''}); s.itens.push(novo); salvarDados(false); renderizarLista(); document.getElementById('input-item-nome-'+sid).value=''; }
    function removerItem(sid,iid){ if(confirm("Remover item?")){ const s=dadosConferencia.find(x=>x.id===sid); s.itens=s.itens.filter(i=>i.id!==iid); salvarDados(false); renderizarLista(); } }
    function renderizarLista(){ const c=document.getElementById('lista-setores-container'); c.innerHTML=''; dadosConferencia.forEach(s=>{ let ih=''; s.itens.forEach(i=>{ ih+=`<li class="item-conferencia-admin"><div style="width:100%"><div style="display:flex;justify-content:space-between;"><div><strong>${i.nome}</strong><small> Qtd: ${i.quantidadeEsperada}</small></div><div class="item-actions-admin"><button class="btn-action btn-edit-alt" onclick="abrirModalEdicao('${s.id}','${i.id}')"><i class="fas fa-edit"></i></button><button class="btn-action btn-remover" onclick="removerItem('${s.id}','${i.id}')"><i class="fas fa-trash"></i></button></div></div></div></li>`; }); c.innerHTML+=`<li class="setor-item"><div class="setor-header-admin" onclick="this.nextElementSibling.classList.toggle('collapsed')"><span>${s.nome}</span><button class="btn-action btn-remover" onclick="event.stopPropagation();removerSetor('${s.id}')">X</button></div><div class="setor-content-admin"><div class="add-item-form-setor"><input type="text" id="input-item-nome-${s.id}" placeholder="Item"><input type="number" id="input-item-qtd-${s.id}" value="1" style="width:50px"><select id="select-item-tipo-${s.id}"><option value="single">Único</option><option value="multi">Tombamento</option></select><button class="btn-add" onclick="adicionarItemPorSetor('${s.id}')">+</button></div><ul class="lista-setores item-list-admin">${ih}</ul></div></li>`; }); }
    function abrirModalEdicao(sid, iid){ const s=dadosConferencia.find(x=>x.id===sid); const i=s.itens.find(x=>x.id===iid); document.getElementById('edit-setor-id').value=sid; document.getElementById('edit-item-original-id').value=iid; document.getElementById('edit-item-nome').value=i.nome; document.getElementById('edit-item-qtd').value=i.quantidadeEsperada; document.getElementById('edit-item-qtd').disabled=(i.tipo==='multi'); document.getElementById('edit-item-tipo').value=i.tipo; const sl=document.getElementById('edit-item-setor'); sl.innerHTML=''; dadosConferencia.forEach(d=>{const o=document.createElement('option'); o.value=d.id; o.text=d.nome; if(d.id===sid)o.selected=true; sl.appendChild(o);}); document.getElementById('modal-edicao').style.display='flex'; }
    function salvarEdicaoItem(){ const osid=document.getElementById('edit-setor-id').value; const iid=document.getElementById('edit-item-original-id').value; const n=document.getElementById('edit-item-nome').value.trim().toUpperCase(); const nsid=document.getElementById('edit-item-setor').value; const q=parseInt(document.getElementById('edit-item-qtd').value); const os=dadosConferencia.find(x=>x.id===osid); const ns=dadosConferencia.find(x=>x.id===nsid); const i=os.itens.find(x=>x.id===iid); i.nome=n; if(i.tipo==='single')i.quantidadeEsperada=q; if(osid!==nsid){ os.itens=os.itens.filter(x=>x.id!==iid); i.id=nsid+'-'+gerarNovoId(); ns.itens.push(i); } salvarDados(false); renderizarLista(); fecharModal(); }
    function fecharModal(){document.getElementById('modal-edicao').style.display='none';}
    function fazerBackupLocal(){ const b=new Blob([JSON.stringify(dadosConferencia,null,2)],{type:"application/json"}); const u=URL.createObjectURL(b); const a=document.createElement('a'); a.href=u; a.download='backup.json'; a.click(); }
    function importarBackupLocal(e){ const f=e.target.files[0]; if(!f)return; const r=new FileReader(); r.onload=function(ev){if(confirm("Substituir?")){try{dadosConferencia=JSON.parse(ev.target.result);salvarDados();renderizarLista();}catch(err){alert("Erro JSON");}}}; r.readAsText(f); }

    document.addEventListener('DOMContentLoaded', () => { loadCaaData(); });
</script>
